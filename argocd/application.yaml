apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: order-service
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/YOUR_USERNAME/order-service-gitops.git
    targetRevision: main
    path: helm/order-service

  destination:
    server: https://kubernetes.default.svc
    namespace: order-service

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true